name: Go Vue Backend Rebuild

on:
  push:
    paths:
      - "server/**"
      - "admin-web/**"
      - "deploy/go-vue/**"
      - ".github/workflows/backend-rebuild.yml"
  pull_request:
    paths:
      - "server/**"
      - "admin-web/**"
      - "deploy/go-vue/**"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" ./cmd/bim-server

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bim-admin-web
          path: admin-web/dist
