{extend name="layout"/}{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-body"><form id="form"><div class="form-group"><label>APPID</label><input class="form-control" name="appid" value="900000002"></div><div class="form-group"><label>启用OTC</label><select class="form-control" name="enabled"><option value="1">启用</option><option value="0">关闭</option></select></div><div class="alert alert-info">当前交易只允许平台余额结算。买方下单时冻结平台余额，卖方确认后到账；取消或超时自动解冻。</div><div class="row"><div class="col-md-3"><label>平台余额</label><select class="form-control" name="payment_balance_enabled"><option value="1" selected>开启</option><option value="0">关闭</option></select></div><div class="col-md-3"><label>支付宝</label><select class="form-control" name="payment_alipay_enabled"><option value="0" selected>关闭</option><option value="1">开启</option></select></div><div class="col-md-3"><label>微信</label><select class="form-control" name="payment_wechat_enabled"><option value="0" selected>关闭</option><option value="1">开启</option></select></div><div class="col-md-3"><label>银行卡</label><select class="form-control" name="payment_bank_enabled"><option value="0" selected>关闭</option><option value="1">开启</option></select></div></div><div class="form-group"><label>商家保证金</label><input class="form-control" name="merchant_deposit" value="1000.00"></div><div class="form-group"><label>广告保证金比例（%）</label><input class="form-control" name="ad_deposit_rate" value="5.00"></div><div class="form-group"><label>单商家最大广告数</label><input class="form-control" name="max_merchant_ads" value="10"></div><div class="form-group"><label>订单确认超时（分钟）</label><input class="form-control" name="payment_timeout_minutes" value="15"></div><div class="form-group"><label>最大进行中订单数</label><input class="form-control" name="max_open_orders" value="5"></div><div class="form-group"><label>风险提示</label><textarea class="form-control" name="risk_notice">交易使用平台余额和数字资产双向托管，禁止脱离平台交易。</textarea></div><button type="button" class="btn btn-primary" onclick="save()">保存</button> <a class="btn btn-default" href="{$Request.root}/otc/index">返回</a></form></div></div></div>{/block}{block name="js"}<script>function save(){$.post("{$Request.root}/otc/config",$('#form').serialize(),function(r){lightyear.notify(r.msg||'保存完成',r.code==1?'success':'danger')},'json')}</script>{/block}
