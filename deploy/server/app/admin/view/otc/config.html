{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-body"><form id="form"><div class="form-group"><label>APPID</label><input class="form-control" name="appid" value="900000002"></div><div class="form-group"><label>启用OTC</label><select class="form-control" name="enabled"><option value="1">启用</option><option value="0">关闭</option></select></div><div class="alert alert-info">当前只允许平台余额即时结算。用户买入的USDT直接进入数字钱包；用户卖币所得直接进入平台钱包。下单必须验证支付密码，双边资金在同一事务内完成托管和划转。</div><input type="hidden" name="payment_balance_enabled" value="1"><input type="hidden" name="payment_alipay_enabled" value="0"><input type="hidden" name="payment_wechat_enabled" value="0"><input type="hidden" name="payment_bank_enabled" value="0"><div class="form-group"><label>商家保证金</label><input class="form-control" name="merchant_deposit" value="1000.00"></div><div class="form-group"><label>广告保证金比例（%）</label><input class="form-control" name="ad_deposit_rate" value="5.00"></div><div class="form-group"><label>单商家最大广告数</label><input class="form-control" name="max_merchant_ads" value="10"></div><div class="form-group"><label>最大并发结算订单数</label><input class="form-control" name="max_open_orders" value="5"></div><input type="hidden" name="payment_timeout_minutes" value="5"><div class="form-group"><label>风险提示</label><textarea class="form-control" name="risk_notice">平台余额与平台USDT即时双向结算，成交后不可撤销。</textarea></div><button type="button" id="save-config" class="btn btn-primary">保存</button> <a class="btn btn-default" href="{$Request.root}/otc/index">返回</a></form></div></div></div>{/block}
{block name="js"}<script>$(document).off('click.otcConfig','#save-config').on('click.otcConfig','#save-config',function(){var b=$(this),old=b.html();b.prop('disabled',true).html('<i class="mdi mdi-loading mdi-spin"></i> 保存中');$.ajax({ url:"{$Request.root}/otc/config",type:'POST',dataType:'json',data:$('#form').serialize()}).done(function(r){lightyear.notify(r.msg||'保存完成',Number(r.code)===1?'success':'danger');}).fail(function(x){lightyear.notify((x.responseJSON||{}).msg||'保存失败','danger');}).always(function(){b.prop('disabled',false).html(old);});});</script>{/block}
