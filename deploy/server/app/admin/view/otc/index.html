{extend name="layout"/}
{block name="body"}
<div class="container-fluid p-t-15"><div class="card"><div class="card-body">
<div class="m-b-15"><a class="btn btn-primary" href="{$Request.root}/otc/index">订单</a> <a class="btn btn-default" href="{$Request.root}/otc/merchants">商家审核</a> <a class="btn btn-default" href="{$Request.root}/otc/ads">广告审核</a> <a class="btn btn-default" href="{$Request.root}/otc/config">系统配置</a></div>
<div class="alert alert-info">平台余额OTC采用即时双边托管结算：平台余额与平台USDT在同一事务内划转，成功订单直接完成，不存在待付款或人工放币。</div>
<div id="toolbar" class="row"><div class="col-md-2"><input class="form-control" id="appid" placeholder="APPID"></div><div class="col-md-3"><input class="form-control" id="order_no" placeholder="订单号"></div><div class="col-md-2"><select class="form-control" id="status"><option value="">全部状态</option><option value="completed">已完成</option><option value="settling">结算中</option><option value="manual_review">人工复核</option><option value="failed">失败</option></select></div><div class="col-md-2"><button id="search" class="btn btn-primary"><i class="mdi mdi-magnify"></i> 查询</button></div></div>
<table id="table"></table></div></div></div>
{/block}
{block name="js"}<script>
$('#table').bootstrapTable({ url:"{$Request.root}/otc/index",method:'get',dataType:'json',toolbar:'#toolbar',pagination:true,sidePagination:'server',pageSize:20,queryParams:function(p){return {limit:p.limit,page:p.offset/p.limit+1,appid:$('#appid').val(),order_no:$.trim($('#order_no').val()),status:$('#status').val()};},columns:[{field:'order_no',title:'订单号'},{field:'side',title:'用户方向',formatter:function(v){return v==='buy'?'买入USDT':'卖出USDT';}},{field:'buyer_nickname',title:'买方'},{field:'seller_nickname',title:'卖方'},{field:'asset_amount',title:'USDT数量'},{field:'fiat_amount',title:'平台余额'},{field:'fiat_hold_status',title:'余额结算',formatter:function(v){return Number(v)===3?'<span class="text-success">已划转</span>':(v?'<span class="text-warning">托管中</span>':'<span class="text-danger">缺失</span>');}},{field:'asset_hold_status',title:'USDT结算',formatter:function(v){return Number(v)===3?'<span class="text-success">已划转</span>':(v?'<span class="text-warning">托管中</span>':'<span class="text-danger">缺失</span>');}},{field:'status',title:'订单状态',formatter:function(v){return v==='completed'?'<span class="badge bg-success">已完成</span>':v;}},{field:'completed_time',title:'完成时间'},{field:'create_time',title:'创建时间'}],onLoadError:function(s){lightyear.notify('OTC订单加载失败（HTTP '+s+'）','danger');}});$('#search').click(function(){$('#table').bootstrapTable('refresh',{pageNumber:1});});
</script>{/block}
