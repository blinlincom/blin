{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-header"><div class="card-title">数字资产账户</div></div><div class="card-body"><div class="row"><div class="col-md-2"><input id="appid" class="form-control" placeholder="APPID"></div><div class="col-md-3"><input id="username" class="form-control" placeholder="用户名或昵称"></div><div class="col-md-2"><button class="btn btn-default" onclick="$('#table').bootstrapTable('refresh')">查询</button></div></div><table id="table"></table></div></div></div>{/block}
{block name="js"}<script>$('#table').bootstrapTable({url:"{$Request.root}/wallet/asset_accounts",method:'get',dataType:'jsonp',pagination:true,sidePagination:'server',pageSize:20,queryParams:function(p){return{limit:p.limit,page:p.offset/p.limit+1,appid:$('#appid').val(),username:$('#username').val()}},columns:[{field:'id',title:'ID'},{field:'appname',title:'应用'},{field:'username',title:'用户名'},{field:'nickname',title:'昵称'},{field:'symbol',title:'资产'},{field:'available_balance',title:'可用'},{field:'frozen_balance',title:'冻结'},{field:'total_in',title:'累计入账'},{field:'total_out',title:'累计支出'},{field:'update_time',title:'更新时间'}]});</script>{/block}
