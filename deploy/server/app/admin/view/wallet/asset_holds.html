{extend name="layout"/}
{block name="body"}
<div class="container-fluid p-t-15"><div class="card"><header class="card-header"><div class="card-title">数字资产冻结管理</div></header><div class="card-body"><div class="alert alert-info">OTC订单冻结由订单状态机自动处理；后台只能人工解冻“风控冻结”，不能提前释放OTC或提币占用的资产。</div><div id="hold-toolbar" class="row"><div class="col-md-4"><input id="hold-keyword" class="form-control" placeholder="用户名、冻结单号、业务单号"></div><div class="col-md-2"><select id="hold-type" class="form-control"><option value="">全部类型</option><option value="admin_risk">风控冻结</option><option value="otc_order">OTC订单</option><option value="withdraw">提币</option></select></div><div class="col-md-2"><select id="hold-status" class="form-control"><option value="">全部状态</option><option value="1">生效中</option><option value="4">部分解冻</option><option value="2">已解冻</option><option value="3">已扣除</option></select></div><div class="col-md-2"><button id="hold-search" class="btn btn-primary"><i class="mdi mdi-magnify"></i> 查询</button></div></div><table id="hold-table"></table></div></div></div>
<div class="modal fade" id="release-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">解冻USDT</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div><div class="modal-body"><input type="hidden" id="release-id"><div class="form-group"><label>解冻数量</label><input id="release-amount" class="form-control"></div><div class="form-group"><label>解冻原因</label><textarea id="release-reason" class="form-control" rows="3"></textarea></div></div><div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">取消</button><button type="button" id="release-submit" class="btn btn-primary">确认解冻</button></div></div></div></div>
{/block}
{block name="js"}<script>
$('#hold-table').bootstrapTable({ url:"{$Request.root}/wallet/asset_holds",method:'get',dataType:'json',toolbar:'#hold-toolbar',pagination:true,sidePagination:'server',pageSize:20,queryParams:function(p){return {limit:p.limit,page:p.offset/p.limit+1,keyword:$.trim($('#hold-keyword').val()),biz_type:$('#hold-type').val(),status:$('#hold-status').val()};},columns:[{field:'hold_no',title:'冻结单号'},{field:'username',title:'用户',formatter:function(v,r){return (r.nickname||v||'-')+'<div class="text-muted">@'+(v||'-')+'</div>'; }},{field:'symbol',title:'资产'},{field:'biz_type',title:'类型'},{field:'biz_no',title:'业务单号'},{field:'original_amount',title:'原始冻结'},{field:'remaining_amount',title:'剩余冻结'},{field:'reason',title:'原因'},{field:'status',title:'状态',formatter:function(v){return ({1:'生效中',2:'已解冻',3:'已扣除',4:'部分解冻'})[v]||v;}},{field:'create_time',title:'创建时间'},{field:'id',title:'操作',formatter:function(v,r){return r.biz_type==='admin_risk'&&(Number(r.status)===1||Number(r.status)===4)?'<button class="btn btn-xs btn-primary release-hold" data-id="'+v+'" data-amount="'+r.remaining_amount+'">解冻</button>':'-';}}]});
$('#hold-search').click(function(){$('#hold-table').bootstrapTable('refresh',{pageNumber:1});});$(document).off('click.assetRelease','.release-hold').on('click.assetRelease','.release-hold',function(){$('#release-id').val($(this).data('id'));$('#release-amount').val($(this).data('amount'));$('#release-reason').val('');$('#release-modal').modal('show');});$('#release-submit').click(function(){var b=$(this);b.prop('disabled',true);$.ajax({ url:"{$Request.root}/wallet/asset_holds",type:'POST',dataType:'json',data:{action:'release',hold_id:$('#release-id').val(),amount:$('#release-amount').val(),reason:$('#release-reason').val()}}).done(function(r){lightyear.notify(r.msg,Number(r.code)===1?'success':'danger');if(Number(r.code)===1){$('#release-modal').modal('hide');$('#hold-table').bootstrapTable('refresh');}}).fail(function(x){lightyear.notify((x.responseJSON||{}).msg||'操作失败','danger');}).always(function(){b.prop('disabled',false);});});
</script>{/block}
