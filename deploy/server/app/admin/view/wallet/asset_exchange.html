{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-header"><div class="card-title">闪兑配置</div></div><div class="card-body"><div class="alert alert-warning">汇率表示 1 USDD 可兑换的平台余额金额。修改配置会使尚未支付的旧报价立即失效。</div>{volist name="configs" id="vo"}<form class="exchange-form border p-3 mb-3"><input type="hidden" name="id" value="{$vo.id}"><h5>{$vo.appname} · {$vo.symbol} → 平台余额</h5><div class="row"><div class="col-md-2"><label>兑换汇率</label><input class="form-control" name="rate" value="{$vo.rate}"></div><div class="col-md-2"><label>手续费率(%)</label><input class="form-control" name="fee_rate" value="{$vo.fee_rate}"></div><div class="col-md-2"><label>最低数量</label><input class="form-control" name="min_amount" value="{$vo.min_amount}"></div><div class="col-md-2"><label>单笔最高</label><input class="form-control" name="max_amount" value="{$vo.max_amount}"></div><div class="col-md-2"><label>每日限额</label><input class="form-control" name="daily_limit" value="{$vo.daily_limit}"></div><div class="col-md-1"><label>报价秒数</label><input class="form-control" name="quote_ttl" value="{$vo.quote_ttl}"></div><div class="col-md-1"><label>状态</label><select class="form-control" name="status"><option value="0">关闭</option><option value="1" {if condition="$vo.status eq 1"}selected{/if}>开启</option></select></div></div><button type="button" class="btn btn-primary mt-3 save-exchange">保存</button></form>{/volist}</div></div><div class="card"><div class="card-header"><div class="card-title">闪兑订单</div></div><div class="card-body"><table id="exchange-table"></table></div></div></div>{/block}
{block name="js"}<script>$('.save-exchange').click(function(){var f=$(this).closest('form');$.post("{$Request.root}/wallet/asset_exchange",f.serialize(),function(r){lightyear.notify(r.msg||'操作完成',r.code==1?'success':'danger');},'json');});$('#exchange-table').bootstrapTable({url:"{$Request.root}/wallet/asset_exchange",method:'get',dataType:'jsonp',pagination:true,sidePagination:'server',columns:[{field:'order_no',title:'订单号'},{field:'username',title:'用户'},{field:'source_amount',title:'USDD数量'},{field:'rate',title:'汇率'},{field:'fee_amount',title:'手续费'},{field:'target_amount',title:'到账余额'},{field:'status',title:'状态'},{field:'create_time',title:'创建时间'},{field:'completed_time',title:'完成时间'}]});</script>{/block}
