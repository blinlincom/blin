{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-header"><div class="card-title">链上钱包配置</div></div><div class="card-body"><div class="alert alert-danger">开放充值或提币前，必须完成正式 USDT 合约、内网 Wallet Service、主种子/HSM、TRON 节点、热钱包和对账审核。不要填写测试密钥。</div>{volist name="rows" id="vo"}<form class="chain-form border p-3 mb-3" method="post"><input type="hidden" name="appid" value="{$vo.appid}"><input type="hidden" name="asset_id" value="{$vo.asset_id}"><input type="hidden" name="network_id" value="{$vo.network_id}"><h5>{$vo.appname} · {$vo.symbol} · {$vo.network_code}</h5><div class="row"><div class="col-md-4"><label>USDT合约地址</label><input class="form-control" name="contract_address" value="{$vo.contract_address|default=''}"></div><div class="col-md-4"><label>Wallet Service</label><input class="form-control" name="wallet_service_url" value="{$vo.wallet_service_url|default=''}" placeholder="http://127.0.0.1:9088"></div><div class="col-md-2"><label>最低充值</label><input class="form-control" name="min_deposit" value="{$vo.min_deposit|default='1'}"></div><div class="col-md-2"><label>最低提币</label><input class="form-control" name="min_withdraw" value="{$vo.min_withdraw|default='10'}"></div><div class="col-md-2"><label>提币手续费</label><input class="form-control" name="withdraw_fee" value="{$vo.withdraw_fee|default='1'}"></div><div class="col-md-2"><label>日提币限额</label><input class="form-control" name="daily_withdraw_limit" value="{$vo.daily_withdraw_limit|default='10000'}"></div><div class="col-md-2"><label>服务状态</label><select class="form-control" name="status"><option value="0">关闭</option><option value="1" {if condition="$vo.status eq 1"}selected{/if}>启用</option></select></div><div class="col-md-2"><label>充值</label><select class="form-control" name="deposit_enabled"><option value="0">关闭</option><option value="1" {if condition="$vo.deposit_enabled eq 1"}selected{/if}>开放</option></select></div><div class="col-md-2"><label>站内转账</label><select class="form-control" name="transfer_enabled"><option value="0">关闭</option><option value="1" {if condition="$vo.transfer_enabled eq 1"}selected{/if}>开放</option></select></div><div class="col-md-2"><label>提币</label><select class="form-control" name="withdraw_enabled"><option value="0">关闭</option><option value="1" {if condition="$vo.withdraw_enabled eq 1"}selected{/if}>开放</option></select></div></div><button type="button" class="btn btn-primary mt-3 save-chain">保存</button></form>{/volist}</div></div></div>{/block}
{block name="js"}<script>$('.save-chain').click(function(){var f=$(this).closest('form');$.post("{$Request.root}/wallet/asset_chain_config",f.serialize(),function(r){lightyear.notify(r.msg||'操作完成',r.code==1?'success':'danger');},'json');});</script>{/block}
