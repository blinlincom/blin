{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><header class="card-header"><div class="card-title">数字资产账户管控</div></header><div class="card-body"><div class="alert alert-warning">账户管控只禁止资金流出，不阻止充值和接收站内转账。管控不会修改用户余额。</div><table id="control-table"></table></div></div></div>{/block}
{block name="js"}<script>
function controlButton(row){var active=Number(row.status)===1;return '<button class="btn btn-xs '+(active?'btn-warning':'btn-primary')+' edit-control" data-row="'+encodeURIComponent(JSON.stringify(row))+'">'+(active?'修改管控':'设置管控')+'</button>'+(active?' <button class="btn btn-xs btn-success clear-control" data-id="'+row.account_id+'">解除</button>':'');}
$('#control-table').bootstrapTable({ url:"{$Request.root}/wallet/asset_controls",method:'get',dataType:'json',pagination:true,sidePagination:'server',pageSize:20,columns:[{field:'username',title:'用户',formatter:function(v,r){return (r.nickname||v||'-')+'<div class="text-muted">@'+(v||'-')+'</div>'; }},{field:'symbol',title:'资产'},{field:'available_balance',title:'可用'},{field:'frozen_balance',title:'冻结'},{field:'block_transfer',title:'站内转账',formatter:function(v){return Number(v)===1?'禁止':'允许';}},{field:'block_otc',title:'OTC',formatter:function(v){return Number(v)===1?'禁止':'允许';}},{field:'block_withdraw',title:'提币',formatter:function(v){return Number(v)===1?'禁止':'允许';}},{field:'block_exchange',title:'闪兑',formatter:function(v){return Number(v)===1?'禁止':'允许';}},{field:'reason',title:'原因'},{field:'account_id',title:'操作',formatter:function(v,r){return controlButton(r);}}]});
function saveControl(data){$.ajax({ url:"{$Request.root}/wallet/asset_controls",type:'POST',dataType:'json',data:data}).done(function(r){lightyear.notify(r.msg,Number(r.code)===1?'success':'danger');if(Number(r.code)===1)$('#control-table').bootstrapTable('refresh');}).fail(function(x){lightyear.notify((x.responseJSON||{}).msg||'操作失败','danger');});}
$(document).off('click.assetControl','.edit-control').on('click.assetControl','.edit-control',function(){var r=JSON.parse(decodeURIComponent($(this).attr('data-row')));var reason=window.prompt('请输入管控原因',r.reason||'');if(reason===null)return;saveControl({account_id:r.account_id,enabled:1,reason:reason,block_transfer:window.confirm('禁止站内转账？')?1:0,block_otc:window.confirm('禁止OTC交易？')?1:0,block_withdraw:window.confirm('禁止提币？')?1:0,block_exchange:window.confirm('禁止闪兑？')?1:0});});$(document).off('click.assetControlClear','.clear-control').on('click.assetControlClear','.clear-control',function(){if(window.confirm('确认解除该账户全部数字资产管控？'))saveControl({account_id:$(this).data('id'),enabled:0});});
</script>{/block}
