{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="row"><div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">充值事件</div><div class="h3">{$depositStats.total}</div></div></div></div><div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">已入账</div><div class="h3">{$depositStats.credited}</div></div></div></div><div class="col-md-4"><div class="card"><div class="card-body"><div class="text-muted">累计到账 USDT</div><div class="h3">{$depositStats.amount}</div></div></div></div></div><div class="card"><header class="card-header"><div class="card-title">链上充值流水</div></header><div class="card-body"><div id="deposit-toolbar" class="row"><div class="col-md-5"><input id="deposit-keyword" class="form-control" placeholder="搜索TXID、地址、用户名"></div><div class="col-md-2"><select id="deposit-status" class="form-control"><option value="">全部状态</option><option value="credited">已入账</option><option value="below_minimum">低于最低充值</option><option value="detected">待处理</option></select></div><div class="col-md-2"><button id="deposit-search" class="btn btn-primary">查询</button></div></div><table id="deposit-table"></table></div></div></div>{/block}
{block name="js"}<script>$('#deposit-table').bootstrapTable({ url:"{$Request.root}/wallet/deposit_events",method:'get',dataType:'json',toolbar:'#deposit-toolbar',pagination:true,sidePagination:'server',pageSize:20,queryParams:function(p){return {limit:p.limit,page:(p.offset/p.limit)+1,keyword:$.trim($('#deposit-keyword').val()),status:$('#deposit-status').val()};},columns:[{field:'id',title:'ID'},{field:'username',title:'用户',formatter:function(v,r){return (r.nickname||v||'-')+'<div class="text-muted">@'+(v||'-')+' · '+(r.user_id||'-')+'</div>'; }},{field:'txid',title:'TXID',formatter:function(v){return '<code>'+v+'</code>'; }},{field:'from_address',title:'发送地址',formatter:function(v){return '<code>'+v+'</code>'; }},{field:'to_address',title:'充值地址',formatter:function(v){return '<code>'+v+'</code>'; }},{field:'amount',title:'数量'},{field:'process_status',title:'状态'},{field:'journal_no',title:'账本号'},{field:'create_time',title:'到账时间'}]});$('#deposit-search').click(function(){$('#deposit-table').bootstrapTable('refresh',{pageNumber:1});});</script>{/block}
