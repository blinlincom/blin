{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-header"><div class="card-title">链上充值地址</div></div><div class="card-body"><div class="alert alert-info">这里只展示地址、公钥派生索引和归集状态，后台永不展示私钥或助记词。</div><table id="table"></table></div></div></div>{/block}
{block name="js"}<script>$('#table').bootstrapTable({url:"{$Request.root}/wallet/chain_addresses",method:'get',dataType:'jsonp',pagination:true,sidePagination:'server',pageSize:20,columns:[{field:'id',title:'ID'},{field:'appname',title:'应用'},{field:'username',title:'用户名'},{field:'symbol',title:'资产'},{field:'network_code',title:'网络'},{field:'address_base58',title:'充值地址'},{field:'derivation_index',title:'派生索引'},{field:'status',title:'状态'},{field:'last_deposit_time',title:'最近充值'},{field:'last_sweep_time',title:'最近归集'}]});</script>{/block}
