{extend name="layout"/}
{block name="body"}<div class="container-fluid p-t-15"><div class="card"><div class="card-header"><div class="card-title">USDT 提币订单</div></div><div class="card-body"><div class="alert alert-warning">已广播但结果未知的订单禁止直接退款。链上签名服务未配置时，订单只能停留在审核状态。</div><div class="row"><div class="col-md-3"><select id="status" class="form-control"><option value="">全部状态</option><option value="risk_review">风控审核</option><option value="queued">等待执行</option><option value="broadcasted">已广播</option><option value="confirming">确认中</option><option value="success">已完成</option><option value="rejected">已驳回</option><option value="manual_review">人工处理</option></select></div><div class="col-md-2"><button class="btn btn-default" onclick="$('#table').bootstrapTable('refresh')">查询</button></div></div><table id="table"></table></div></div></div>{/block}
{block name="js"}<script>
function withdrawAction(id,action){var reason='';if(action==='reject'){reason=window.prompt('请输入驳回原因');if(reason===null)return;if(!$.trim(reason)){lightyear.notify('驳回原因不能为空','warning');return;}}if(action==='approve'&&!window.confirm('确认审核通过并加入链上提现队列？'))return;$.post("{$Request.root}/wallet/asset_withdrawals",{id:id,action:action,reason:reason},function(r){lightyear.notify(r.msg||'操作完成',Number(r.code)===1?'success':'danger');if(Number(r.code)===1)$('#table').bootstrapTable('refresh');},'json');}
$('#table').bootstrapTable({ url:"{$Request.root}/wallet/asset_withdrawals",method:'get',dataType:'json',pagination:true,sidePagination:'server',pageSize:20,queryParams:function(p){return{limit:p.limit,page:p.offset/p.limit+1,status:$('#status').val()}},columns:[{field:'withdraw_no',title:'提币单号'},{field:'appname',title:'应用'},{field:'username',title:'用户'},{field:'symbol',title:'资产'},{field:'network_code',title:'网络'},{field:'amount',title:'数量'},{field:'fee',title:'手续费'},{field:'receive_amount',title:'到账'},{field:'to_address',title:'目标地址',formatter:function(v){return '<code>'+v+'</code>';}},{field:'status',title:'状态'},{field:'txid',title:'TXID',formatter:function(v){return v?'<code>'+v+'</code>':'-';}},{field:'last_error',title:'执行信息'},{field:'create_time',title:'创建时间'},{field:'id',title:'操作',formatter:function(v,r){if(r.status==='risk_review')return '<button class="btn btn-xs btn-success" onclick="withdrawAction('+v+',\'approve\')">通过</button> <button class="btn btn-xs btn-danger" onclick="withdrawAction('+v+',\'reject\')">驳回</button>';if(r.status==='manual_review')return '<button class="btn btn-xs btn-danger" onclick="withdrawAction('+v+',\'reject\')">退款并关闭</button>';return '-';}}]});</script>{/block}
