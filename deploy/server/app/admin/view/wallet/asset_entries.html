{extend name="layout"/}
{block name="body"}
<div class="container-fluid p-t-15">
    {if $account}
    <div class="alert alert-info">当前账户：{$account.nickname ?: $account.username}（@{$account.username}） · {$account.symbol} · 可用 {$account.available_balance} · 冻结 {$account.frozen_balance}</div>
    {/if}
    <div class="card">
        <header class="card-header"><div class="card-title">数字资产流水</div></header>
        <div class="card-body">
            <div id="toolbar" class="row">
                <div class="col-md-4"><input id="keyword" class="form-control" placeholder="用户、账本号、业务单号、备注"></div>
                <div class="col-md-2"><select id="business_type" class="form-control"><option value="">全部类型</option><option value="deposit">链上充值</option><option value="internal_transfer">站内转账</option><option value="withdraw_freeze">提币冻结</option><option value="asset_hold">资产冻结</option><option value="asset_release">资产解冻</option><option value="asset_consume">冻结扣除</option></select></div>
                <div class="col-md-2"><button id="search" class="btn btn-primary"><i class="mdi mdi-magnify"></i> 查询</button></div>
                <div class="col-md-2"><a class="btn btn-default" href="{$Request.root}/wallet/asset_accounts">返回账户</a></div>
            </div>
            <table id="table"></table>
        </div>
    </div>
</div>
{/block}
{block name="js"}
<script>
$('#table').bootstrapTable({
    url:"{$Request.root}/wallet/asset_entries", method:'get', dataType:'json', toolbar:'#toolbar', pagination:true, sidePagination:'server', pageSize:20,
    queryParams:function(p){return {limit:p.limit,page:(p.offset/p.limit)+1,account_id:{$accountId|default=0},keyword:$.trim($('#keyword').val()),business_type:$('#business_type').val()};},
    onLoadError:function(status){lightyear.notify('数字资产流水加载失败（HTTP '+status+'）','danger');},
    columns:[
        {field:'id',title:'ID'}, {field:'create_time',title:'时间'},
        {field:'username',title:'用户',formatter:function(v,r){return (r.nickname||v||'-')+'<div class="text-muted">@'+(v||'-')+'</div>'; }},
        {field:'symbol',title:'资产'}, {field:'business_type',title:'业务类型'}, {field:'business_no',title:'业务单号'}, {field:'journal_no',title:'账本号'},
        {field:'direction',title:'方向',formatter:function(v){return v==='credit'?'<span class="text-success">入账</span>':'<span class="text-danger">出账</span>'; }},
        {field:'available_delta',title:'可用变动'}, {field:'frozen_delta',title:'冻结变动'}, {field:'available_after',title:'变动后可用'}, {field:'frozen_after',title:'变动后冻结'}, {field:'remark',title:'备注'}
    ]
});
$('#search').click(function(){ $('#table').bootstrapTable('refresh',{pageNumber:1}); });
</script>
{/block}
